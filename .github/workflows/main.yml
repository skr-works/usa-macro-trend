name: US Macro Trend Update

on:
  schedule:
    # 毎日 UTC 21:00 (EST 16:00 / JST 翌06:00) に実行
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  update-macro-trend:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run script
      env:
        DATA_PIPELINE_CREDENTIALS: ${{ secrets.DATA_PIPELINE_CREDENTIALS }}
      run: python main.py
